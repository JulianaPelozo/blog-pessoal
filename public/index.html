<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Diário</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    try {
      const t = localStorage.getItem('theme');
      if (t) document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a href="#/" class="brand">📝 <span>Meu Diário</span></a>
      <nav class="topbar__actions">
        <button class="icon-btn" id="glitter-toggle" type="button" aria-label="Ligar/desligar glitter" aria-pressed="true">✨</button>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Alternar tema">🌓</button>
        <a href="#/novo" class="btn btn--primary">
          <span aria-hidden="true">＋</span><span class="hide-sm">Novo post</span>
        </a>
      </nav>
    </div>
  </header>

  <main id="app" class="container" aria-live="polite"></main>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox__close" type="button" aria-label="Fechar">✕</button>
    <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Anterior">‹</button>
    <img alt="">
    <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Próxima">›</button>
    <span class="lightbox__count"></span>
  </div>

  <canvas id="glitter" class="glitter" aria-hidden="true"></canvas>

  <div id="toasts" class="toasts" role="status"></div>

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/glitter.js"></script>
</body>
</html>
